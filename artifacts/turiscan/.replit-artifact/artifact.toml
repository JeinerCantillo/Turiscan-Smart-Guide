kind = "mobile"
previewPath = "/"
title = "Turiscan"
version = "1.0.0"
id = "artifacts/turiscan"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23260

[services.development]
run = "pnpm --filter @workspace/turiscan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/turiscan", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/turiscan", "run", "serve" ]

[services.env]
PORT = "23260"
BASE_PATH = "/"
